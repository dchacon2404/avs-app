<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuevo Drop - Alpha Vintage</title>
  <link href="https://fonts.googleapis.com/css2?family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/NuevoDrop.css" />
</head>
<body>

  <header class="main-header">
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html">Inicio</a>
        <a href="NuevoDrop.html" class="active">Drop</a>
        <a href="contacto.html">Contacto</a>
      </div>
      <a href="index.html" class="logo">AVS</a>
      <div class="nav-right">
        <img src="images/buscar.png" alt="Buscar">
        <img src="images/agregar-usuario.png" alt="Usuario">
        <a href="carrito.html" style="position:relative;">
          <img src="images/anadir-al-carrito.png" alt="Carrito">
          <span class="cart-badge" id="cart-badge"></span>
        </a>
      </div>
    </nav>
  </header>

  <section class="drop-section">
    <div class="drop-section-header">
      <span class="section-label">Colección actual</span>
      <h2>Nuevo Drop</h2>
    </div>
    <div class="drop-grid" id="drop-grid">
      <!-- productos dinámicos -->
    </div>
  </section>

  <script>
    const container = document.getElementById('drop-grid');

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function isInCart(productId) {
      return getCart().some(item => item.id === productId);
    }

    function addToCart(prod, imgSrc) {
      const cart = getCart();
      if (isInCart(prod.id)) return;
      cart.push({
        id: prod.id,
        name: prod.nombre,
        price: prod.precio,
        img: imgSrc,
        talla: prod.talla,
        cantidad: 1
      });
      localStorage.setItem("cart", JSON.stringify(cart));
      const total = cart.reduce((sum, p) => sum + p.cantidad, 0);
      localStorage.setItem("cartCount", total);
      updateBadge(total);
    }

    function updateBadge(count) {
      const badge = document.getElementById('cart-badge');
      if (!badge) return;
      badge.textContent = count > 0 ? count : '';
    }

    async function mostrarProductos() {
      container.innerHTML = '';
      try {
        const res = await fetch('/api/productos');
        const productos = await res.json();

        productos.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const imgSrc = prod.imagenes[0].startsWith("/") ? prod.imagenes[0].slice(1) : prod.imagenes[0];
          const enCarrito = isInCart(prod.id);

          if (prod.estado === false) {
            card.innerHTML = `
              <div class="card-link sold">
                <div class="img-container">
                  <img src="${imgSrc}" alt="${prod.nombre}">
                  <div class="banner-vendido">AGOTADO</div>
                </div>
                <h3>${prod.nombre}</h3>
                <div class="price">₡${prod.precio}</div>
                <div class="talla">Talla: ${prod.talla}</div>
              </div>
            `;
            card.style.opacity = '0.6';
            card.style.pointerEvents = 'none';
          } else {
            card.innerHTML = `
              <a href="producto.html?id=${prod.id}" class="card-link">
                <div class="img-container">
                  <img src="${imgSrc}" alt="${prod.nombre}">
                  <div class="card-overlay"><span>Ver producto</span></div>
                </div>
                <h3>${prod.nombre}</h3>
                <div class="price">₡${prod.precio}</div>
                <div class="talla">Talla: ${prod.talla}</div>
              </a>
              <button class="btn-add-cart ${enCarrito ? 'in-cart' : ''}" data-id="${prod.id}">
                ${enCarrito ? 'En carrito' : 'Añadir al carrito'}
              </button>
            `;

            const btn = card.querySelector('.btn-add-cart');
            if (!enCarrito) {
              btn.addEventListener('click', (e) => {
                e.preventDefault();
                addToCart(prod, imgSrc);
                btn.textContent = 'En carrito';
                btn.classList.add('in-cart');
              });
            }
          }

          container.appendChild(card);
        });

      } catch (err) {
        console.error('Error cargando productos:', err);
        container.innerHTML = '<p style="padding:40px;color:#7A7468;">Error cargando productos. Intenta más tarde.</p>';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateBadge(localStorage.getItem("cartCount") || 0);
      mostrarProductos();
    });
  </script>

</body>
</html>
